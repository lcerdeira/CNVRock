# Experiment 29 — KpSC Phase C threshold tuning
#
# Exp 28 results (Phase C with GT evaluation):
#   blaKPC:    MCC=1.00  FNR=0.00  PPV=1.00  ✓
#   blaCTX-M:  MCC=0.82  FNR=0.20  PPV=1.00  ✓ (accepted; irreducible cross-map FNs)
#   blaNDM:    MCC=0.99  FNR=0.00  PPV=0.99  ✓
#   qnrB1:     MCC=0.82  FNR=0.01  PPV=0.74  — 33 FPs; qnrB variants cross-map
#   blaOXA-48: MCC=0.67  FNR=0.02  PPV=0.51  — 38 FPs; OXA-48-like variants (OXA-181/232)
#   aac6-Ib-cr:MCC=0.65  FNR=0.47  PPV=0.95  — 70 FNs; low PCN (0.08-0.19), threshold too high
#
# Exp 29 changes:
#   1. qnrB1 GT pattern expanded to all qnrB variants (reference cross-maps to family)
#   2. blaOXA-48 GT pattern expanded to OXA-48-like variants (OXA-181/232/244)
#   3. aac6-Ib-cr absent_threshold: 0.20 → 0.10 (rescues FNs with PCN 0.10-0.19)
#   No retraining; plasmid CNV calls re-run with updated threshold, then re-evaluated.

architecture: "06_conv_vae"
hmm:          "02_gaussian_hmm"
cnv:          "06_gene_cnv_caller"
evaluation:   "04_kpsc_evaluation"

store_path: "../../../data/inputs/KpSC-HS11286-1000bp-core-npy"
out_dir:    "../../../data/results/29_kpsc_phase_c_v3"
normalise:  true

kpsc_gt_path:            "../../../assets/kpsc_amrfinder_ground_truth.tsv"
kpsc_kleborate_gt_path:  "../../../assets/kpsc_kleborate_ground_truth.tsv"
kpsc_meta_path:          "../../../assets/kpsc_sample_metadata.tsv"

plasmid_cnv:               "07_plasmid_cnv_caller"
plasmid_store_path:        "../../../data/inputs/KpSC-plasmid-1000bp-npy"
plasmid_gene_coords_path:  "../../../assets/plasmid_refs/plasmid_gene_coords.tsv"
pcn_absent_threshold:      0.20   # global default; overridden per-gene in coords TSV
pcn_amp_threshold:         1.50

latent_dim:    10
batch_size:    128
epochs:        150
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 20
patience:      20

sin_loss_max_weight:    1.0
sin_loss_warmup_epochs: 30

hmm_n_states:          6
hmm_self_transition:   0.80
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.50
cnv_flank_padding:              100000
cnv_crr_amp_threshold:          1.75
cnv_crr_gate_threshold:         1.75
cnv_crr_min_bins_fallback:      3
cnv_min_gene_coverage_fraction: 0.50

eval_min_group_n: 10
