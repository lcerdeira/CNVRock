# Experiment 26 — KpSC Phase B: blaCTX-M-15 absent_threshold 0.50 + blaCTX-M-14 added
#
# Exp 25 results:
#   blaKPC:   MCC=1.00  FNR=0.00  PPV=1.00  ✓
#   blaNDM:   MCC=0.99  FNR=0.00  PPV=0.99  ✓
#   blaCTX-M: MCC=0.52  FNR=0.27  PPV=?
#     — absent_threshold=1.00 cut too deep: 72 FNs (vs 33 at threshold=0.20)
#     — 40 new FNs are low-copy CTX-M-15 (PCN 0.20–1.00)
#     — 33 original FNs carry non-CTX-M-15 variants whose reads cross-map to
#       HS11286 blaSHV and do not appear in unmapped read pool (irreducible FNs)
#
# Fix: lower blaCTX-M-15 absent_threshold from 1.00 → 0.50 (set in coords TSV).
#   Expected: recover ~20–30 low-copy CTX-M-15 FNs; accept modest FP increase.
#
# blaCTX-M-14 (NZ_CP031850.1) now in plasmid store but contributes 0 counts:
#   unmapped read approach cannot recover non-CTX-M-15 variants whose CTX-M
#   reads are already mapped to chromosomal blaSHV in original BAMs.
#
# All other parameters identical to exp 25.

architecture: "06_conv_vae"
hmm:          "02_gaussian_hmm"
cnv:          "06_gene_cnv_caller"
evaluation:   "04_kpsc_evaluation"

store_path: "../../../data/inputs/KpSC-HS11286-1000bp-core-npy"
out_dir:    "../../../data/results/26_kpsc_phase_b_v3"
normalise:  true

kpsc_gt_path:            "../../../assets/kpsc_amrfinder_ground_truth.tsv"
kpsc_kleborate_gt_path:  "../../../assets/kpsc_kleborate_ground_truth.tsv"
kpsc_meta_path:          "../../../assets/kpsc_sample_metadata.tsv"

plasmid_cnv:               "07_plasmid_cnv_caller"
plasmid_store_path:        "../../../data/inputs/KpSC-plasmid-1000bp-npy"
plasmid_gene_coords_path:  "../../../assets/plasmid_refs/plasmid_gene_coords.tsv"
pcn_absent_threshold:      0.20   # global default; overridden per-gene in coords TSV
pcn_amp_threshold:         1.50

latent_dim:    10
batch_size:    128
epochs:        150
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 20
patience:      20

sin_loss_max_weight:    1.0
sin_loss_warmup_epochs: 30

hmm_n_states:          6
hmm_self_transition:   0.80
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.50
cnv_flank_padding:              100000
cnv_crr_amp_threshold:          1.75
cnv_crr_gate_threshold:         1.75
cnv_crr_min_bins_fallback:      3
cnv_min_gene_coverage_fraction: 0.50

eval_min_group_n: 10
