# Experiment 30 — KpSC hold-out validation (80/20 stratified split)
#
# Identical architecture and hyperparameters to exp 29, but trained on 80% of
# samples only.  The held-out 20% are excluded from training via holdout_ids_path
# but included in inference so they receive latents, reconstructions, and gene
# calls.  Evaluation is restricted to held-out samples via eval_holdout_ids_path.
#
# Hold-out split created by:
#   python data/setup/create_holdout_split.py --seed 42 --holdout-frac 0.20
# Stratified by blaKPC / blaCTX-M / blaNDM presence to preserve class balance.
#
# Baseline (exp 29, full cohort):
#   blaKPC:    MCC=1.00  FNR=0.00  PPV=1.00
#   blaCTX-M:  MCC=0.82  FNR=0.20  PPV=1.00
#   blaNDM:    MCC=0.99  FNR=0.00  PPV=0.99
#   qnrB1:     MCC=0.98  FNR=0.01  PPV=0.97
#   blaOXA-48: MCC=0.98  FNR=0.02  PPV=0.97
#   aac6-Ib-cr:MCC=0.86  FNR=0.26  PPV=0.95

architecture: "06_conv_vae"
hmm:          "02_gaussian_hmm"
cnv:          "06_gene_cnv_caller"
evaluation:   "04_kpsc_evaluation"

store_path: "../../../data/inputs/KpSC-HS11286-1000bp-core-npy"
out_dir:    "../../../data/results/30_kpsc_holdout_v1"
normalise:  true

# Hold-out split — generated by create_holdout_split.py
holdout_ids_path:      "../../../assets/holdout_sample_ids.txt"
eval_holdout_ids_path: "../../../assets/holdout_sample_ids.txt"

kpsc_gt_path:            "../../../assets/kpsc_amrfinder_ground_truth.tsv"
kpsc_kleborate_gt_path:  "../../../assets/kpsc_kleborate_ground_truth.tsv"
kpsc_meta_path:          "../../../assets/kpsc_sample_metadata.tsv"

plasmid_cnv:               "07_plasmid_cnv_caller"
plasmid_store_path:        "../../../data/inputs/KpSC-plasmid-1000bp-npy"
plasmid_gene_coords_path:  "../../../assets/plasmid_refs/plasmid_gene_coords.tsv"
pcn_absent_threshold:      0.20
pcn_amp_threshold:         1.50

latent_dim:    10
batch_size:    128
epochs:        150
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 20
patience:      20

sin_loss_max_weight:    1.0
sin_loss_warmup_epochs: 30

hmm_n_states:          6
hmm_self_transition:   0.80
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.50
cnv_flank_padding:              100000
cnv_crr_amp_threshold:          1.75
cnv_crr_gate_threshold:         1.75
cnv_crr_min_bins_fallback:      3
cnv_min_gene_coverage_fraction: 0.50

eval_min_group_n: 10
