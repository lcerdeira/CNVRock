# Experiment 24 — KpSC: drop ompK35/ompK36 from CNV, add BLAST blaSHV GT
#
# Changes from experiment 23:
#   06_gene_cnv_caller: removed ompK35/ompK36 (frameshift loss-of-function ≠
#     copy-number deletion; CRR was identical for functional vs disrupted samples)
#   get_kleborate_gt.py: added BLAST-based blaSHV copy counting; overrides
#     AMRFinder GT for blaSHV (AMRFinder missed ~31 amplified samples)
#   04_kpsc_evaluation: blaSHV added to KLEBORATE_GENES (uses BLAST GT)
#   ramR: now callable via BLAST (blast+ installed)
#
# All HMM/model/threshold parameters unchanged from exp 23.

# Versioned components
architecture: "06_conv_vae"
hmm:          "02_gaussian_hmm"
cnv:          "06_gene_cnv_caller"
evaluation:   "04_kpsc_evaluation"

# Data (same NPY store as exp 21–23)
store_path: "../../../data/inputs/KpSC-HS11286-1000bp-core-npy"
out_dir:    "../../../data/results/24_kpsc_chromosomal_v4"
normalise:  true

# Ground truth — regenerate with BLAST before running:
#   python data/setup/get_kleborate_gt.py \
#       --kleborate-tsv  assets/kleborate_out.tsv/klebsiella_pneumo_complex_output.txt \
#       --amrfinder-gt   assets/kpsc_amrfinder_ground_truth.tsv \
#       --reference      assets/HS11286.fasta \
#       --assemblies-dir data/assemblies/ \
#       --out            assets/kpsc_kleborate_ground_truth.tsv
kpsc_gt_path:            "../../../assets/kpsc_amrfinder_ground_truth.tsv"
kpsc_kleborate_gt_path:  "../../../assets/kpsc_kleborate_ground_truth.tsv"
kpsc_meta_path:          "../../../assets/kpsc_sample_metadata.tsv"

# Plasmid PCN calling (blaKPC-2)
plasmid_cnv:               "07_plasmid_cnv_caller"
plasmid_store_path:        "../../../data/inputs/KpSC-plasmid-1000bp-npy"
plasmid_gene_coords_path:  "../../../assets/plasmid_refs/plasmid_gene_coords.tsv"
pcn_absent_threshold:      0.20
pcn_amp_threshold:         1.50

# Model (same as exp 21–23)
latent_dim:    10
batch_size:    128
epochs:        150
lr:            1.0e-4
weight_decay:  1.0e-5
max_beta:      1.0
warmup_epochs: 20
patience:      20

sin_loss_max_weight:    1.0
sin_loss_warmup_epochs: 30

# HMM (same stable values as exp 23)
hmm_n_states:          6
hmm_self_transition:   0.80
hmm_low_cov_threshold: 10
hmm_n_jobs:            -1

# CNV calling (same thresholds as exp 23)
cnv_min_cn1_proportion:         0.55
cnv_min_confidence:             0.50
cnv_flank_padding:              100000
cnv_crr_amp_threshold:          1.75
cnv_crr_gate_threshold:         1.75
cnv_crr_min_bins_fallback:      3
cnv_min_gene_coverage_fraction: 0.50

eval_min_group_n: 10
