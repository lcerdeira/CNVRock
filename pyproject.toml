[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cnvrock"
version = "0.1.0"
description = "AMR gene copy-number variation in Klebsiella pneumoniae using variational autoencoders"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["antimicrobial resistance", "copy number variation", "Klebsiella", "VAE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "hmmlearn>=0.3",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
diagnostics = [
    "streamlit>=1.35",
    "bokeh>=3.4",
    "umap-learn>=0.5",
    "matplotlib>=3.9",
]
report = [
    "python-docx>=1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/lcerdeira/CNVRock"

[tool.setuptools.packages.find]
where = ["models"]

[tool.ruff]
line-length = 100
src = ["models", "data", "diagnostics"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
